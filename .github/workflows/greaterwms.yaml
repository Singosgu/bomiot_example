name: Bomiot Build

env:
  COMMUNITY_KEY: "MDA6RTA6NEU6MTA61fJBMUIaiKXj6w3JctaeAroqCKStJYJO21-Mcx4MyJw5lQABNnjUH2mBlA=="
  SPONSOR_KEY: "MDA6RTA6NEU6MTA61fJBMUIaiKXj6w3JctaeAroqGLuvJoRPwODFiW18OLrz9DeKBYKoNTY="

  APP_NAME: "GreaterWMS"
  BASE_VERSION: "3.0.8"
# APP_NAME / BASE_VERSION / BASE_URL are read from launcher.py by `bomiot build`
# itself. All Nuitka parameters, manifest generation, node_modules exclusion,
# sponsor verification, and build.json are handled by `bomiot build`.
  # Keep Python I/O in UTF-8 on every runner (Windows defaults to cp1252)
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  # Nuitka stores downloaded tools (dependency walker, ccache, MSVC config)
  # here; caching the directory avoids re-downloading on every run
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Mirrors Nuitka-Action: ccache is installed on Linux only, where
      # Nuitka detects it in PATH automatically. macOS and Windows runners
      # already ship clang / MSVC, so no extra toolchain setup is needed.
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-py313-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-py313-
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Dependencies
        run: |
          pip install bomiot
          pip show bomiot
          # Fail fast when pip silently falls back to a bomiot release that
          # does not ship the bomiot_cmd wheel for this platform
          python -c "import bomiot_cmd"

      - name: Bomiot Build
        run: bomiot build
        env:
          PYTHONPATH: "${{ github.workspace }}${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/bomiot"

      - name: Clean .build directories
        shell: bash
        run: |
          find build -type d -name "*.build" -exec rm -rf {} + 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BASE_VERSION }}-${{ runner.os }}
          path: |
            build/manifest--*.json
            build/${{ env.APP_NAME }}-${{ env.BASE_VERSION }}-*
          include-hidden-files: true
