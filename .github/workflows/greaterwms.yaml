name: Bomiot Build
env:
  APP_NAME: "GreaterWMS"
  BASE_VERSION: "3.0.8"
  COMMUNITY_KEY: "MDA6RTA6NEU6MTA61fJBMUIaiKXj6w3JctaeAroqCKStJYJO21-Mcx4MyJw5lQABNnjUH2mBlA=="
  SPONSOR_KEY: "MDA6RTA6NEU6MTA61fJBMUIaiKXj6w3JctaeAroqGLuvJoRPwODFiW18OLrz9DeKBYKoNTY="

# APP_NAME / BASE_VERSION and auth keys are supplied through env.
# Nuitka-Action mirrors `bomiot build`; post-processing writes build.json and manifest.

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:

      # Check-out repository
      - uses: actions/checkout@v4

      # Setup Python
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11 # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
          cache: 'pip'
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          pip install -r requirements.txt

      # Generate apps.json (mirrors build.py generate_apps_json)
      - name: Generate apps.json
        run: |
          python -c "import sys, os; sys.path.insert(0, os.getcwd()); from discovered_apps import main; sys.argv=[sys.argv[0]]; main(os.getcwd())"

      # Ensure launcher.py has workers=1 (mirrors build.py ensure_launcher_workers_one)
      - name: Force workers=1 in launcher.py
        shell: bash
        run: |
          python - <<'PY'
          import re

          with open("launcher.py", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r"workers\s*=\s*\d+", "workers=1", content)
          content = re.sub(
              r'(os\.environ\.setdefault\(\s*"WORKERS"\s*,\s*)"[^"]*"\s*\)',
              r'\g<1>"1")',
              content,
          )

          with open("launcher.py", "w", encoding="utf-8") as f:
              f.write(content)
          PY

      # Copy launcher.py -> {APP_NAME}.py (mirrors build.py)
      - name: Copy launcher.py to application entry point
        run: |
          python -c "import os, shutil; shutil.copyfile('launcher.py', os.environ['APP_NAME'] + '.py')"

      # Cache Nuitka C compilation cache on macOS (standard runner only has 3 vCPU)
      - name: Cache Nuitka
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: nuitka-${{ runner.os }}-4.3.5-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            nuitka-${{ runner.os }}-4.3.5-

      # ------------------------------------------------------------------
      # Windows
      # ------------------------------------------------------------------
      - uses: Nuitka/Nuitka-Action@main
        if: runner.os == 'Windows'
        with:
          jobs: 16
          nuitka-version: "4.3.5"
          script-name: ${{ env.APP_NAME }}.py
          mode: standalone
          assume-yes-for-downloads: true
          lto: yes
          output-dir: build
          company-name: Bomiot
          product-name: ${{ env.APP_NAME }}
          file-description: No-environment delivery tool for Python apps Compile to binary · Cross-platform · Incremental updates · Source code protection
          file-version: ${{ env.BASE_VERSION }}
          product-version: ${{ env.BASE_VERSION }}
          copyright: Copyright (c) 2020 ${{ env.APP_NAME }}
          windows-icon-from-ico: logo.ico
          windows-console-mode: disable
          enable-plugins: tk-inter,anti-bloat
          module-parameter: django-settings-module=bomiot.server.server.settings
          # ---- include packages (mirrors DEFAULT_INCLUDE_PACKAGES) ----
          include-package: |
            bomiot
            django
            fastapi
            flask
            orjson
            uvicorn
            pandas
            openpyxl
            watchdog
            tomlkit
            psutil
            xlsxwriter
            requests
            httptools
            aiofiles
            starlette
            bomiot_asgi
            bomiot_message
            bomiot_token
            bomiot_pay
            django_filters
            rest_framework
            rest_framework_csv
            django_apscheduler
            corsheaders
            greaterwms
            PIL
          # ---- include package data (mirrors DEFAULT_INCLUDE_PACKAGE_DATA) ----
          include-package-data: |
            django
            greaterwms
          # ---- include modules (mirrors DEFAULT_INCLUDE_MODULES) ----
          include-module: |
            django.core.management
            bomiot_cmd
          # ---- nofollow imports (mirrors DEFAULT_NOFOLLOW_IMPORT_TO) ----
          nofollow-import-to: |
            pandas.tests
            django.test
            rest_framework.tests
            IPython
            pytest
            unittest
            bomiot.cmd.extends
            bomiot.cmd.file
            bomiot.cmd.newapi
          # ---- include data files (mirrors DEFAULT_INCLUDE_DATA_FILES) ----
          include-data-files: |
            .gitignore=.gitignore
            setup.ini=setup.ini
            splash.png=splash.png
            apps.json=apps.json
            greaterwms/server.py=greaterwms/server.py
            greaterwms/receiver.py=greaterwms/receiver.py
            greaterwms/files.py=greaterwms/files.py
            greaterwms/task.py=greaterwms/task.py
