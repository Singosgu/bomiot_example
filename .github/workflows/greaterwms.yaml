      # Rename output, write build.json, and generate the incremental-update manifest
      - name: Generate build.json and manifest
        shell: python
        run: |
          import hashlib
          import json
          import os
          import platform
          import shutil

          app_name = os.environ["APP_NAME"]
          version = os.environ["BASE_VERSION"]
          community_key = os.environ.get("COMMUNITY_KEY", "")
          sponsor_key = os.environ.get("SPONSOR_KEY", "")
          if not community_key or not sponsor_key:
              raise RuntimeError("COMMUNITY_KEY / SPONSOR_KEY not set")

          system = platform.system()
          if system == "Windows":
              os_label, display = "windows", "Windows"
          elif system == "Darwin":
              os_label, display = "macos", "macOS"
          else:
              os_label, display = "linux", "Linux"
          arch = "arm64" if platform.machine().lower() in ("arm64", "aarch64") else "x64"

          folder_name = f"{app_name}-{version}-{display}"
          output_dir = os.path.join("build", folder_name)
          dist_dir = os.path.join("build", f"{app_name}.dist")
          app_bundle = os.path.join("build", f"{app_name}.app")

          if os.path.exists(output_dir):
              shutil.rmtree(output_dir)
          if os.path.isdir(dist_dir):
              shutil.move(dist_dir, output_dir)
          elif os.path.isdir(app_bundle):
              shutil.move(app_bundle, output_dir)
          else:
              raise RuntimeError(f"Build output not found: {dist_dir} or {app_bundle}")

          for root, dirs, _ in os.walk(output_dir):
              if "node_modules" in dirs:
                  shutil.rmtree(os.path.join(root, "node_modules"))
                  dirs.remove("node_modules")

          payload = {
              "COMMUNITY_KEY": community_key,
              "SPONSOR_KEY": sponsor_key,
          }
          build_json_path = os.path.join(output_dir, "build.json")
          with open(build_json_path, "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)

          block_size = int(0.25 * 1024 * 1024)
          block_threshold = 1 * 1024 * 1024
          manifest_name = f"manifest--{app_name}-{os_label}-{arch}.json"
          files = {}

          for root, _, filenames in os.walk(output_dir):
              for filename in filenames:
                  if filename == manifest_name:
                      continue
                  full_path = os.path.join(root, filename)
                  relative_path = os.path.relpath(full_path, output_dir).replace(os.sep, "/")
                  file_size = os.path.getsize(full_path)

                  if file_size >= block_threshold:
                      full_hash = hashlib.sha256()
                      blocks = []
                      with open(full_path, "rb") as f:
                          while True:
                              chunk = f.read(block_size)
                              if not chunk:
                                  break
                              full_hash.update(chunk)
                              blocks.append(hashlib.sha256(chunk).hexdigest())
                      files[relative_path] = {
                          "size": file_size,
                          "sha256": full_hash.hexdigest(),
                          "block_size": block_size,
                          "blocks": blocks,
                      }
                  else:
                      with open(full_path, "rb") as f:
                          files[relative_path] = hashlib.sha256(f.read()).hexdigest()

          manifest = {
              "app_name": app_name,
              "version": version,
              "os": os_label,
              "arch": arch,
              "files": files,
          }
          manifest_path = os.path.join(output_dir, manifest_name)
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          shutil.copyfile(manifest_path, os.path.join("build", manifest_name))
          print(f"Generated {build_json_path} and {manifest_path}: {len(files)} files")

      # Uploads artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BASE_VERSION }}-${{ runner.os }}
          path: |
            build/${{ env.APP_NAME }}-${{ env.BASE_VERSION }}-*/**/*
            build/manifest--${{ env.APP_NAME }}-*.json
          include-hidden-files: true
