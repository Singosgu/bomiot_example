name: Bomiot Build

env:
  COMMUNITY_KEY: "MDA6RTA6NEU6MTA61fJBMUIaiKXj6w3JctaeAroqCKStJYJO21-Mcx4MyJw5lQABNnjUH2mBlA=="
  SPONSOR_KEY: "MDA6RTA6NEU6MTA61fJBMUIaiKXj6w3JctaeAroqGLuvJoRPwODFiW18OLrz9DeKBYKoNTY="

  APP_NAME: "GreaterWMS"
  BASE_VERSION: "3.0.0"
# APP_NAME / BASE_VERSION / BASE_URL are read from launcher.py by `bomiot build`
# itself. All Nuitka parameters, manifest generation, node_modules exclusion,
# sponsor verification, and build.json are handled by `bomiot build`.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Toolchain setup per platform: Nuitka needs a C compiler and
      # optionally ccache to speed up repeated C compilation.
      - name: Setup Build Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache patchelf

      - name: Setup Build Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p || sudo xcode-select --install || true
          brew install ccache || true

      - name: Setup Build Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ccache -y --no-progress

      - name: Install Dependencies
        run: |
          pip install bomiot

      - name: Bomiot Build
        run: bomiot build
        env:
          PYTHONPATH: "${{ github.workspace }}${{ runner.os == 'Windows' && ';' || ':' }}${{ github.workspace }}/bomiot"
          PYTHONIOENCODING: "utf-8"

      - name: Clean .build directories
        shell: bash
        run: |
          find build -type d -name "*.build" -exec rm -rf {} + 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.BASE_VERSION }}-${{ runner.os }}
          path: |
            build/manifest--*.json
            build/${{ env.APP_NAME }}-${{ env.BASE_VERSION }}-*
          include-hidden-files: true
